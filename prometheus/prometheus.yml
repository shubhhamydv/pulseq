global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: pulseq-api
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:3000']
        labels:
          service: api
          project: pulseq

  # Workers currently expose liveness through Redis heartbeats rather than HTTP.
  # Their activity is therefore surfaced through the API monitoring metrics.
