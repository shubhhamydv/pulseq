previews:
  generation: manual

services:
  - type: web
    name: pulseq-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: pulseq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulseq-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REQUEST_BODY_LIMIT
        value: 64kb
      - key: DEMO_RATE_WINDOW_MS
        value: '60000'
      - key: DEMO_RATE_LIMIT
        value: '10'
      - key: DEMO_MAX_RETRIES
        value: '5'
      - key: DEMO_MAX_PAYLOAD_BYTES
        value: '10240'
      - key: DEMO_RETENTION_HOURS
        value: '24'
      - key: WORKER_HEARTBEAT_TIMEOUT_MS
        value: '20000'

  - type: web
    name: pulseq-frontend
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: pulseq-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile.scheduler
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulseq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulseq-redis
          type: keyvalue
          property: connectionString
      - key: SCHEDULER_POLL_INTERVAL_MS
        value: '1000'
      - key: SCHEDULER_LOCK_TTL_MS
        value: '30000'

  - type: worker
    name: pulseq-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulseq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulseq-redis
          type: keyvalue
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: '10'
      - key: WORKER_BATCH_LIMIT
        value: '10'
      - key: WORKER_POLL_INTERVAL_MS
        value: '1000'
      - key: WORKER_LOCK_TTL_MS
        value: '30000'
      - key: WORKER_PROCESSING_LEASE_MS
        value: '60000'
      - key: WORKER_HEARTBEAT_INTERVAL_MS
        value: '5000'
      - key: WORKER_HEARTBEAT_TIMEOUT_MS
        value: '20000'

  - type: keyvalue
    name: pulseq-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: cron
    name: pulseq-demo-cleanup
    runtime: node
    schedule: '0 * * * *'
    buildCommand: npm ci
    startCommand: node scripts/cleanup-demo.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulseq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulseq-redis
          type: keyvalue
          property: connectionString
      - key: DEMO_RETENTION_HOURS
        value: '24'
      - key: DEMO_CLEANUP_BATCH_SIZE
        value: '500'

databases:
  - name: pulseq-db
    databaseName: pulseq
    user: pulseq
    plan: starter
